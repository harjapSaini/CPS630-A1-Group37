<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopperPet — Smart Grocery List</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shopping_cart" />
  <script src="/js/home.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand"><span class="material-symbols-outlined nav-brand-icon">shopping_cart</span> ShopperPet</a>
    <div class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/list">List</a>
      <a href="/add">Add</a>
      <a href="/analytics">Analytics</a>

  <main class="container">
    <section class="hero">
      <h1>
        <span class="material-symbols-outlined title-icon">shopping_cart</span>ShopperPet
      </h1>
      <p class="subtitle">Your simple, smart grocery list manager.</p>
      <div class="btn-group">
        <a href="/list" class="btn btn-primary">View List</a>

        <a href="/analytics" class="btn btn-secondary">Analytics</a>

      <div id="recent-items" class="grocery-list">

  <footer class="footer"><p>ShopperPet &copy; 2026 — CPS 630 A1 Group 37</p></footer>
