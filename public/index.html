<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopperPet Smart Grocery List</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon_io/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon_io/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon_io/favicon-16x16.png">
  <link rel="manifest" href="/assets/favicon_io/site.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shopping_cart" />
  <script src="/js/home.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand"><span class="material-symbols-outlined nav-brand-icon">shopping_cart</span> ShopperPet</a>
    <div class="nav-links">
      <a href="/" class="active">Home</a>
      <a href="/list">List</a>
      <a href="/add">Add</a>
      <a href="/analytics">Analytics</a>
    </div>
  </nav>
  <main class="container">
    <section class="hero">
      <h1>
        <span class="material-symbols-outlined title-icon">shopping_cart</span>ShopperPet
      </h1>
      <p class="subtitle">Your simple, smart grocery list manager.</p>
      <div class="btn-group">
        <a href="/list" class="btn btn-primary">View List</a>
        <a href="/add" class="btn btn-primary">Add New</a>
        <a href="/analytics" class="btn btn-secondary">Analytics</a>
      </div>
    </section>
    <section>
      <h2>Recently Added</h2>
      <div id="recent-items" class="grocery-list">
        <div class="empty-state"><p>Loading...</p></div>
      </div>
    </section>
  </main>

</body>
</html>
