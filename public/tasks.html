<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Task Manager</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <a href="/" class="nav-brand">
                ✅ Task Manager
            </a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/tasks" class="active">Tasks</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="tasks-container">
            <!-- Add Task Form -->
            <div class="form-card">
                <h2>➕ Add New Task</h2>
                <form id="task-form">
                    <div class="form-group">
                        <label for="title">Task Title *</label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            placeholder="Enter task title..."
                            required
                            maxlength="100"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea 
                            id="description" 
                            name="description" 
                            placeholder="Enter task description (optional)..."
                            maxlength="500"
                        ></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="low">🟢 Low</option>
                            <option value="medium" selected>🟡 Medium</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        ✅ Add Task
                    </button>
                </form>
            </div>

            <!-- Task List -->
            <div class="tasks-list-container">
                <div class="tasks-header">
                    <h2>📋 Your Tasks</h2>
                    <span class="task-count" id="task-count">0</span>
                </div>
                
                <ul id="tasks-list">
                    <li class="loading">
                        Loading tasks...
                    </li>
                </ul>
            </div>
        </div>
    </main>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <!-- Footer -->
    <footer>
        <p>CPS 630 - Assignment 1 | Group 37 | © 2026</p>
        <p>Built with <a href="https://expressjs.com/" target="_blank">Express.js</a></p>
    </footer>

    <!-- JavaScript -->
    <script src="/js/main.js"></script>
</body>
</html>
